      resetToSetupStart();
    };


    let algPlayback=null, algPlayToken=0, activeAlgId=null, nextMoveQueue=Promise.resolve();
    let openCaseId=null, activeCaseId=null;
    const formulaPanel=document.querySelector('#formula-panel');
    const dockCases=document.querySelector('#dock-cases');
    const viewedPllCases=new Set((readSetting('rubik-pll-viewed')||'').split('|').map(decodeURIComponent).filter(Boolean));
    function markPllCaseViewed(caseId){
      if(!caseId||viewedPllCases.has(caseId)) return;
      viewedPllCases.add(caseId);
      persistSetting('rubik-pll-viewed', [...viewedPllCases].map(encodeURIComponent).join('|'));
    }
    const invertToken=token=>{
      const t=normalizeMove(token);
      if(t.endsWith('2')) return t;
      return t.endsWith('′')?t.slice(0,-1):`${t}′`;
    };
    const stepDelay=()=>Math.max(scrambleDelay, 120);
    const isMobileUi=()=>matchMedia('(max-width:720px)').matches;
    function markActiveAlgRow(id){
      activeAlgId=id;
      document.querySelectorAll('.opt-row').forEach(row=>row.classList.toggle('is-active', row.dataset.algId===id));
    }
    function updateMoveStepHighlight(){
      document.querySelectorAll('.opt-row').forEach(row=>{
        const isCurrent=algPlayback&&row.dataset.algId===algPlayback.id;
        const highlightedStep=Math.max(0,(algPlayback?.index||0)-1);
        row.querySelectorAll('.move-step').forEach((step,index)=>step.classList.toggle('is-current',isCurrent&&index===highlightedStep));
      });
    }
    function beginAlgPlayback(id, sequence, isSetup){
      algPlayback={id, moves:parseMoves(sequence), index:0, isSetup};
      activeAlgId=id;
      updateMoveStepHighlight();
    }
    async function algPlayAll(id, sequence, isSetup, status){
      if(busy) return;
      const token=++algPlayToken;
      markActiveAlgRow(id);
      beginAlgPlayback(id, sequence, isSetup);
      if(isSetup){ resetToSetupStart(); algPlayback.index=0; }
      while(algPlayback&&algPlayback.id===id&&algPlayback.index<algPlayback.moves.length){
        if(token!==algPlayToken) return;
        await runMoves([algPlayback.moves[algPlayback.index]], stepDelay());
        if(token!==algPlayToken) return;
        algPlayback.index++;
        updateMoveStepHighlight();
        stateEl.textContent=`${status} · ${algPlayback.index}/${algPlayback.moves.length}`;
      }
      if(token===algPlayToken) stateEl.textContent=status;
    }
    async function algNext(id, sequence, isSetup, status){
      const token=algPlayToken;
      nextMoveQueue=nextMoveQueue.then(async()=>{
        if(token!==algPlayToken||busy) return;
        markActiveAlgRow(id);
        if(!algPlayback||algPlayback.id!==id){ beginAlgPlayback(id, sequence, isSetup); if(isSetup) resetToSetupStart(); }
        if(!algPlayback||algPlayback.index>=algPlayback.moves.length) return;
        if(token!==algPlayToken) return;
        const move=algPlayback.moves[algPlayback.index];
        await runMoves([move], stepDelay());
        if(token!==algPlayToken||!algPlayback) return;
        algPlayback.index++;
        updateMoveStepHighlight();
        stateEl.textContent=`${status} · ${algPlayback.index}/${algPlayback.moves.length}`;
      }).catch(error=>{console.error('Không thể chạy nước tiếp theo:',error);});
      return nextMoveQueue;
    }
    async function algPrev(id, sequence, isSetup, status){
      if(busy) return;
      markActiveAlgRow(id);
      if(!algPlayback||algPlayback.id!==id||algPlayback.index<=0) return;
      algPlayback.index--;
      await runMoves([invertToken(algPlayback.moves[algPlayback.index])], stepDelay());
      updateMoveStepHighlight();
      stateEl.textContent=`${status} · ${algPlayback.index}/${algPlayback.moves.length}`;
    }
    function createAlgRow({id, label, sequence, isSetup, status, extraClass=''}){
      const row=document.createElement('div');
      row.className=`opt-row${activeAlgId===id?' is-active':''}`;
      row.dataset.algId=id;
      const btn=document.createElement('button');
      btn.type='button'; btn.className=`opt-label${extraClass?` ${extraClass}`:''}`;
      const [labelPrefix,labelMoves='']=label.split(' · ');
      btn.append(document.createTextNode(`${labelPrefix} · `));
      labelMoves.split(/\s+/).filter(Boolean).forEach((move,index)=>{const step=document.createElement('span'); step.className='move-step'; step.dataset.step=String(index); step.textContent=move; btn.append(step,' ');});
      btn.title=sequence||''; btn.disabled=!sequence;
      btn.onclick=()=>algPlayAll(id, sequence, isSetup, status);
      const controls=document.createElement('div'); controls.className='opt-controls';
      const mk=(cls, text, title, fn)=>{
        const b=document.createElement('button'); b.type='button'; b.className=cls; b.textContent=text; b.title=title; b.setAttribute('aria-label',title);
        b.disabled=!sequence; b.onclick=()=>{ fn(id, sequence, isSetup, status); b.blur(); }; return b;
      };
      controls.appendChild(mk('opt-prev','◀◀','Prev / lùi 1 nước',algPrev));
      controls.appendChild(mk('opt-play','▶','Play / chạy hết',algPlayAll));
      controls.appendChild(mk('opt-next','▶▶','Next / tới 1 nước',algNext));
      row.appendChild(btn); row.appendChild(controls);
      return row;
    }
    function scrollActiveCaseIntoView(){
      if(!activeCaseId||openCaseId) return;
      const card=formulaPanel.querySelector(`.case-card[data-case-id="${CSS.escape(activeCaseId)}"]`);
      const strip=formulaPanel.querySelector('.case-strip');
      if(!card) return;
      requestAnimationFrame(()=>{
        if(strip){
          const left=card.offsetLeft-(strip.clientWidth-card.offsetWidth)/2;
          strip.scrollTo({left:Math.max(0,left), behavior:'smooth'});
        } else {
          card.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
        }
      });
    }
    function closeOpenCase(){
      if(openCaseId) activeCaseId=openCaseId;
      openCaseId=null; algPlayback=null; algPlayToken++; activeAlgId=null;
      renderFormulaButtons();
      scrollActiveCaseIntoView();
    }
    function closeCasesDockPanel(){
      formulaPanel.classList.remove('is-sheet-dragging','is-sheet-dismissing');
      formulaPanel.style.transform=''; formulaPanel.style.opacity='';
      if(openCaseId) activeCaseId=openCaseId;
      openCaseId=null; algPlayback=null; algPlayToken++; activeAlgId=null;
      setDockPanels(null);
      syncMobileDockFromSheets();
      renderFormulaButtons();
    }
    function setDockPanels(openSheet){
      formulaPanel.classList.toggle('is-dock-open', openSheet==='cases');
    }
    function syncMobileDockFromSheets(){
      if(!isMobileUi()) return;
      const keyboardOpen=!movePad.hidden;
      const openSheet=keyboardOpen?'keyboard'
        :formulaPanel.classList.contains('is-dock-open')?'cases'
        :null;
      dockKeyboard.classList.toggle('is-active', openSheet==='keyboard');
      dockKeyboard.setAttribute('aria-pressed', String(openSheet==='keyboard'));
      dockCases.classList.toggle('is-active', openSheet==='cases');
      dockCases.setAttribute('aria-pressed', String(openSheet==='cases'));
    }
    function closeMovePadInstant(){
      if(window.anime) anime.remove(movePad);
      movePad.hidden=true;
      movePad.classList.remove('is-animating');
      movePad.style.opacity=''; movePad.style.transform='';
      movePadToggle.classList.remove('is-active');
      movePadToggle.setAttribute('aria-expanded','false');
    }
    function setMobileDockSheet(sheet){
      if(!isMobileUi()) return;
      const keyboardOpen=!movePad.hidden;
      const casesOpen=formulaPanel.classList.contains('is-dock-open');
      const current=keyboardOpen?'keyboard':casesOpen?'cases':null;
      const next=current===sheet?null:sheet;
      if(next==='keyboard'){
        setDockPanels(null);
        setMovePadOpen(true);
      } else if(next==='cases'){
        closeMovePadInstant();
        setDockPanels('cases');
        syncMobileDockFromSheets();
        scrollActiveCaseIntoView();
      } else {
        closeMovePadInstant();
        setDockPanels(null);
        syncMobileDockFromSheets();
      }
    }
    function enableFormulaPanelSwipeDismiss(){
      if(!isMobileUi()) return;
      const handle=formulaPanel.querySelector(':scope > .case-drag');
      if(!handle) return;
      let startY=0, startX=0, dragging=false, dy=0, moved=false;
      const applyShift=(y, opacity)=>{
        formulaPanel.style.transform=`translateY(${y}px)`;
        formulaPanel.style.opacity=opacity;
      };
      const clearShift=()=>{
        formulaPanel.style.transform='';
        formulaPanel.style.opacity='';
      };
      const onStart=(event)=>{
        const point=event.touches?event.touches[0]:event;
        startY=point.clientY; startX=point.clientX; dragging=true; dy=0; moved=false;
        formulaPanel.classList.add('is-sheet-dragging');
      };
      const onMove=(event)=>{
        if(!dragging) return;
        const point=event.touches?event.touches[0]:event;
        const deltaY=point.clientY-startY, deltaX=point.clientX-startX;
        if(Math.abs(deltaX)>Math.abs(deltaY)&&dy<8) return;
        dy=Math.max(0, deltaY);
        if(dy>6) moved=true;
        applyShift(dy, String(Math.max(.35, 1-dy/220)));
        if(event.cancelable) event.preventDefault();
      };
      const onEnd=()=>{
        if(!dragging) return;
        dragging=false; formulaPanel.classList.remove('is-sheet-dragging');
        if(dy>72){
          formulaPanel.classList.add('is-sheet-dismissing');
          applyShift(Math.max(dy,180), '0');
          setTimeout(()=>{
            if(openCaseId) closeOpenCase();
            else closeCasesDockPanel();
          }, 180);
        } else {
          clearShift();
        }
        dy=0;
      };
      handle.addEventListener('touchstart', onStart, {passive:true});
      handle.addEventListener('touchmove', onMove, {passive:false});
      handle.addEventListener('touchend', onEnd);
      handle.addEventListener('touchcancel', onEnd);
      handle.addEventListener('click', event=>{
        if(moved){ event.preventDefault(); moved=false; return; }
        if(openCaseId) closeOpenCase();
        else closeCasesDockPanel();
      });
    }
    function renderFormulaButtons(){
      formulaPanel.innerHTML='';
      formulaPanel.classList.remove('is-sheet-dragging','is-sheet-dismissing');
      formulaPanel.style.transform=''; formulaPanel.style.opacity='';
      if(isMobileUi()){
        const drag=document.createElement('button');
        drag.type='button'; drag.className='case-drag'; drag.setAttribute('aria-label','Kéo xuống để đóng');
        drag.title='Kéo xuống để đóng';
        formulaPanel.appendChild(drag);
      }
      const caseListParent=(!openCaseId&&isMobileUi())?(()=>{
        const strip=document.createElement('div');
        strip.className='case-strip';
        formulaPanel.appendChild(strip);
        return strip;
      })():formulaPanel;
      pllCases.forEach(entry=>{
        const card=document.createElement('div');
        const viewed=viewedPllCases.has(entry.id);
        const isActive=activeCaseId===entry.id&&openCaseId!==entry.id;
        card.className=`case-card${openCaseId===entry.id?' is-open':''}${viewed?' is-viewed':''}${isActive?' is-active':''}`;
        card.dataset.caseId=entry.id;
        if(viewed) card.setAttribute('data-viewed','true');
        if(isActive) card.setAttribute('aria-current','true');
        const main=document.createElement('button');
        main.type='button'; main.className='case-main'; main.title='Mở setup & công thức giải';
        if(entry.preview){const img=document.createElement('img'); img.className='preview'; img.src=entry.preview; img.alt=`Preview ${entry.id}`; img.loading='lazy'; main.appendChild(img);}
        const label=document.createElement('span'); label.className='formula-id'; label.textContent=entry.id; main.appendChild(label);
        main.onclick=()=>{
          const opening=openCaseId!==entry.id;
          openCaseId=opening?entry.id:null;
          activeCaseId=entry.id;
          if(opening) markPllCaseViewed(entry.id);
          algPlayback=null; algPlayToken++; activeAlgId=null;
          renderFormulaButtons();
          if(!opening) scrollActiveCaseIntoView();
        };
        card.appendChild(main);
        const options=document.createElement('div'); options.className='case-options';
        const list=document.createElement('div'); list.className='opt-list';
        list.appendChild(createAlgRow({
          id:`${entry.id}|setup`,
          label:`SETUP · ${entry.setup||'—'}`,
          sequence:entry.setup||'',
          isSetup:true,
          status:`SETUP · ${entry.id}`,
          extraClass:'opt-setup'
        }));
        (entry.solutions||[]).forEach((alg,index)=>{
          list.appendChild(createAlgRow({
            id:`${entry.id}|solve|${index}`,
            label:`GIẢI ${index+1} · ${alg}`,
            sequence:alg,
            isSetup:false,
            status:`SOLVE · ${entry.id} · ${index+1}`
          }));
        });
        options.appendChild(list);
        card.appendChild(options);
        caseListParent.appendChild(card);
      });
      enableFormulaPanelSwipeDismiss();
    }
    renderFormulaButtons();

    const movePadTokens=['U','U′','U2','D','D′','L','L′','R','R′','F','F′','B','B′','M','M′','S','S′','r','r′','l','l′','f','f′','b','b′','x','x′','y','y′','z','z′'];
    const movePad=document.querySelector('#move-pad');
    const movePadToggle=document.querySelector('#move-pad-toggle');
    const dockKeyboard=document.querySelector('#dock-keyboard');
    // dockCases already queried above
    const movePadCollapse=document.createElement('button');
    movePadCollapse.type='button';
    movePadCollapse.className='move-pad-collapse';
    movePadCollapse.setAttribute('aria-label','Kéo xuống để thu gọn bàn phím');
    movePadCollapse.title='Kéo xuống để thu gọn';
    const movePadKeys=document.createElement('div');
    movePadKeys.className='move-pad-keys';
    movePad.append(movePadCollapse, movePadKeys);
    const movePadRowSize=7;
    for(let i=0;i<movePadTokens.length;i+=movePadRowSize){
      const rowEl=document.createElement('div');
      rowEl.className='move-row';
      movePadTokens.slice(i,i+movePadRowSize).forEach(move=>{
        const btn=document.createElement('button');
        btn.type='button';
        btn.textContent=move;
        btn.dataset.move=move;
        btn.setAttribute('aria-label',`Xoay ${move}`);
        btn.onclick=()=>{if(busy)return; runMoves(parseMoves(move));};
        rowEl.appendChild(btn);
      });
      movePadKeys.appendChild(rowEl);
    }
    function syncDockKeyboard(){
      syncMobileDockFromSheets();
      if(!isMobileUi()){
        const open=!movePad.hidden;
        dockKeyboard.classList.toggle('is-active',open);
        dockKeyboard.setAttribute('aria-pressed',String(open));
      }
    }
    function setMovePadOpen(open, {instant=false}={}){
      const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
      const mobile=matchMedia('(max-width:720px)').matches;
      if(open){
        if(mobile) setDockPanels(null);
        movePad.hidden=false;
        movePad.classList.add('is-animating');
        if(mobile) movePadToggle.hidden=true;
        if(window.anime&&!reduce&&!instant){
          anime.remove(movePad);
          anime({targets:movePad, opacity:[0,1], translateY:[18,0], duration:320, easing:'easeOutCubic', complete:()=>movePad.classList.remove('is-animating')});
          anime({targets:movePadKeys.querySelectorAll('button'), opacity:[0,1], scale:[.86,1], delay:anime.stagger(12,{start:40}), duration:280, easing:'easeOutBack'});
        } else {
          if(window.anime) anime.remove(movePad);
          movePad.classList.remove('is-animating');
          movePad.style.opacity=''; movePad.style.transform='';
        }
      } else {
        if(window.anime) anime.remove(movePad);
        const finishClose=()=>{
          movePad.hidden=true;
          movePad.classList.remove('is-animating','is-sheet-dragging');
          movePad.style.opacity=''; movePad.style.transform='';
          if(!mobile) movePadToggle.hidden=false;
          syncDockKeyboard();
        };
        if(!instant&&window.anime&&!reduce&&!movePad.hidden){
          movePad.classList.add('is-animating');
          anime({targets:movePad, opacity:[1,0], translateY:[0,24], duration:180, easing:'easeInCubic', complete:finishClose});
        } else {
          finishClose();
        }
      }
      movePadToggle.setAttribute('aria-expanded',String(open));
      movePadToggle.setAttribute('aria-label',open?'Đóng bảng xoay Rubik':'Mở bảng xoay Rubik');
      movePadToggle.classList.toggle('is-active',open);
      syncDockKeyboard();
    }
    movePadToggle.onclick=()=>{
      if(movePadToggle.dataset.dragged==='1'){ delete movePadToggle.dataset.dragged; return; }
      setMovePadOpen(movePad.hidden);
    };
    dockKeyboard.onclick=()=>{
      if(isMobileUi()) setMobileDockSheet('keyboard');
      else setMovePadOpen(movePad.hidden);
    };
    dockCases.onclick=()=>setMobileDockSheet('cases');
    if(isMobileUi()) movePadToggle.hidden=true;
    addEventListener('resize',()=>{
      if(!isMobileUi()){
        setDockPanels(null);
        dockKeyboard.classList.remove('is-active');
        dockKeyboard.setAttribute('aria-pressed','false');
        dockCases.classList.remove('is-active');
        dockCases.setAttribute('aria-pressed','false');
        movePadToggle.hidden=false;
      } else {
        movePadToggle.hidden=true;
        syncMobileDockFromSheets();
      }
    });

    function enableMovePadSwipeDismiss(){
      let startY=0, startX=0, dragging=false, dy=0, moved=false;
      const applyShift=(y, opacity)=>{ movePad.style.transform=`translateY(${y}px)`; movePad.style.opacity=opacity; };
      const clearShift=()=>{ movePad.style.transform=''; movePad.style.opacity=''; };
      const onStart=event=>{
        if(!matchMedia('(max-width:720px)').matches||movePad.hidden) return;
        const point=event.touches?event.touches[0]:event;
        startY=point.clientY; startX=point.clientX; dragging=true; dy=0; moved=false;
        movePad.classList.add('is-sheet-dragging');
      };
      const onMove=event=>{
        if(!dragging) return;
        const point=event.touches?event.touches[0]:event;
        const deltaY=point.clientY-startY, deltaX=point.clientX-startX;
        if(Math.abs(deltaX)>Math.abs(deltaY)&&dy<8) return;
        dy=Math.max(0, deltaY);
        if(dy>6) moved=true;
        applyShift(dy, String(Math.max(.35, 1-dy/220)));
        if(event.cancelable) event.preventDefault();
      };
      const onEnd=()=>{
        if(!dragging) return;
        dragging=false; movePad.classList.remove('is-sheet-dragging');
        if(dy>56){ applyShift(Math.max(dy,220), '0'); setTimeout(()=>setMovePadOpen(false, {instant:true}), 120); }
        else clearShift();
        dy=0;
      };
      movePadCollapse.addEventListener('touchstart', onStart, {passive:true});
      movePadCollapse.addEventListener('touchmove', onMove, {passive:false});
      movePadCollapse.addEventListener('touchend', onEnd);
      movePadCollapse.addEventListener('touchcancel', onEnd);
      movePadCollapse.addEventListener('click', event=>{
        if(moved){ event.preventDefault(); event.stopImmediatePropagation(); moved=false; return; }
        setMovePadOpen(false, {instant:true});
      });
    }
    enableMovePadSwipeDismiss();

    function clampKbdPos(left, top){
      const w=movePadToggle.offsetWidth||42, h=movePadToggle.offsetHeight||42;
      const maxL=Math.max(0, innerWidth-w), maxT=Math.max(0, innerHeight-h);
      return {left:Math.min(maxL, Math.max(0, left)), top:Math.min(maxT, Math.max(0, top))};
    }
    function applyKbdPos(left, top){
      const pos=clampKbdPos(left, top);
      movePadToggle.style.left=`${pos.left}px`;
      movePadToggle.style.top=`${pos.top}px`;
      movePadToggle.style.right='auto';
      movePadToggle.style.bottom='auto';
      return pos;
    }
    function persistKbdPos(left, top){
      const pos=clampKbdPos(left, top);
      persistSetting('rubik-kbd-pos', `${Math.round(pos.left)},${Math.round(pos.top)}`);
      return pos;
    }
    const savedKbdPos=readSetting('rubik-kbd-pos');
    if(savedKbdPos){
      const [left, top]=savedKbdPos.split(',').map(Number);
      if(Number.isFinite(left)&&Number.isFinite(top)) applyKbdPos(left, top);
    }
    let kbdDrag=null;
    movePadToggle.addEventListener('pointerdown',event=>{
      if(event.button!==0||movePadToggle.hidden) return;
      const rect=movePadToggle.getBoundingClientRect();
      kbdDrag={pointerId:event.pointerId, startX:event.clientX, startY:event.clientY, left:rect.left, top:rect.top, moved:false};
      movePadToggle.setPointerCapture(event.pointerId);
    });
    movePadToggle.addEventListener('pointermove',event=>{
      if(!kbdDrag||event.pointerId!==kbdDrag.pointerId) return;
      const dx=event.clientX-kbdDrag.startX, dy=event.clientY-kbdDrag.startY;
      if(!kbdDrag.moved&&Math.hypot(dx,dy)<6) return;
      kbdDrag.moved=true;
      movePadToggle.classList.add('is-dragging');
      applyKbdPos(kbdDrag.left+dx, kbdDrag.top+dy);
    });
    const endKbdDrag=event=>{
      if(!kbdDrag||event.pointerId!==kbdDrag.pointerId) return;
      movePadToggle.classList.remove('is-dragging');
      if(kbdDrag.moved){
        const rect=movePadToggle.getBoundingClientRect();
        persistKbdPos(rect.left, rect.top);
        movePadToggle.dataset.dragged='1';
      }
      kbdDrag=null;
    };
    movePadToggle.addEventListener('pointerup', endKbdDrag);
    movePadToggle.addEventListener('pointercancel', endKbdDrag);

    function playUiEntrance(){
      if(!window.anime||matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      anime({targets:'.brand', opacity:[0,1], translateY:[-16,0], duration:700, easing:'easeOutExpo'});
      anime({targets:'.practice-controls button, .settings-toggle, .reset-cube, .move-pad-toggle, .status', opacity:[0,1], translateY:[-10,0], delay:anime.stagger(50,{start:120}), duration:520, easing:'easeOutCubic'});
      anime({targets:'.formula-panel .case-card', opacity:[0,1], translateX:[24,0], delay:anime.stagger(45,{start:180}), duration:520, easing:'easeOutCubic'});
    }
    if(document.readyState==='complete') playUiEntrance();
    else addEventListener('load', playUiEntrance, {once:true});

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
      if(movePadToggle.style.left){
        const left=parseFloat(movePadToggle.style.left), top=parseFloat(movePadToggle.style.top);
        if(Number.isFinite(left)&&Number.isFinite(top)) applyKbdPos(left, top);
      }
    });
    renderer.setAnimationLoop(()=>{controls.update(); renderer.render(scene,camera);});
  </script>
</body>
</html>
