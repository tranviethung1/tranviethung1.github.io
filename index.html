<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tran Viet Hung</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f1a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 50px;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 2rem; margin-bottom: 10px; }
    p { color: #aaa; margin-bottom: 30px; }
    .links a {
      display: inline-block;
      margin: 8px;
      padding: 10px 24px;
      background: #667eea;
      color: #fff;
      border-radius: 25px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.3s;
    }
    .links a:hover { background: #764ba2; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👤</div>
    <h1>Trần Việt Hùng</h1>
    <p>Xin chào! Đây là trang cá nhân của tôi 👋</p>
    <div class="links">
      <a href="#">GitHub</a>
      <a href="#">Facebook</a>
      <a href="#">Liên hệ</a>
    </div>
  </div>
</body>
</html>
