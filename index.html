<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUBIK / 03</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap');
    :root { --ink:#121212; --cream:#f4f0e8; --accent:#ff4b2b; --line:rgba(18,18,18,.18); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; color:var(--ink); background:var(--cream); font-family:'DM Mono',monospace; }
    #stage { position:fixed; inset:0; cursor:grab; } #stage:active { cursor:grabbing; }
    canvas { display:block; width:100%; height:100%; outline:none; }
    .grain { pointer-events:none; position:fixed; inset:0; opacity:.2; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E"); mix-blend-mode:multiply; }
    header { position:fixed; inset:0 0 auto; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; padding:28px 32px; pointer-events:none; }
    .brand { font-family:Syne,sans-serif; font-weight:800; font-size:clamp(27px,4vw,50px); line-height:.8; letter-spacing:-.08em; } .brand span { color:var(--accent); }
    .meta { text-align:right; font-size:10px; letter-spacing:.1em; line-height:1.65; opacity:.7; }
    .panel { position:fixed; z-index:3; left:32px; bottom:30px; width:252px; padding:16px; background:rgba(244,240,232,.9); border:1px solid var(--line); backdrop-filter:blur(9px); box-shadow:8px 8px 0 rgba(18,18,18,.07); }
    .panel h1 { font-family:Syne,sans-serif; margin:0 0 12px; font-size:15px; letter-spacing:-.04em; } .panel p { margin:0; font-size:10px; line-height:1.65; opacity:.73; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:15px; }
    button { min-height:38px; color:var(--ink); border:1px solid var(--ink); background:transparent; font:500 10px 'DM Mono',monospace; letter-spacing:.04em; cursor:pointer; transition:background .18s,color .18s,transform .18s; }
    button:hover, button:focus-visible { background:var(--ink); color:var(--cream); outline:2px solid var(--accent); outline-offset:2px; } button:active { transform:translate(2px,2px); }
    .status { position:fixed; right:32px; bottom:32px; z-index:2; font-size:10px; letter-spacing:.1em; text-align:right; line-height:1.7; } .status b { color:var(--accent); }
    .hint { position:fixed; z-index:2; left:50%; bottom:38px; transform:translateX(-50%); font-size:10px; letter-spacing:.09em; white-space:nowrap; opacity:.66; }
    .practice-controls { position:fixed; z-index:3; right:32px; top:28px; display:flex; gap:8px; } .practice-controls button { padding:0 14px; background:rgba(244,240,232,.84); backdrop-filter:blur(9px); } .practice-controls button.is-active { background:var(--ink); color:var(--cream); }
    @media (max-width:650px) { header { padding:21px; } .practice-controls { right:18px; top:70px; } .practice-controls button { padding:0 9px; font-size:9px; } .panel { left:18px; bottom:18px; width:225px; } .status { right:18px; top:130px; bottom:auto; } .hint { display:none; } }
  </style>
</head>
<body>
  <main id="stage" aria-label="Mô phỏng khối Rubik 3x3 có thể tương tác"></main>
  <div class="grain"></div>
  <header><div class="brand">RUBIK<span>:</span>03</div></header>
  <nav class="practice-controls" aria-label="Điều khiển luyện tập"><button id="f2l-practice" type="button" aria-pressed="false">LUYỆN F2L</button><button id="f2l-scramble" type="button">XÁO TRỘN F2L</button></nav>
  <div class="hint">KÉO ĐỂ QUAN SÁT &nbsp; / &nbsp; DÙNG PHÍM R L U D F B ĐỂ XOAY</div>
  <div class="status"><b id="move-count">00</b> MOVES<br><span id="state">WHITE CROSS ↓</span></div>

  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const stage = document.querySelector('#stage'), stateEl = document.querySelector('#state'), moveEl = document.querySelector('#move-count');
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f0e8);
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, .1, 100); camera.position.set(8.4, 7.1, 9.8);
    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.9; stage.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.07; controls.minDistance=8; controls.maxDistance=17; controls.target.set(0,0,0); controls.autoRotate=true; controls.autoRotateSpeed=.5;
    // Soft, neutral room lighting: fill from every direction while retaining subtle form shadows.
    scene.add(new THREE.HemisphereLight(0xffffff,0xe9e4dc,2.55));
    const key=new THREE.DirectionalLight(0xffffff,2.35); key.position.set(5,8,7); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key);
    const fill=new THREE.DirectionalLight(0xffffff,1.5); fill.position.set(-6,4,5); scene.add(fill);
    const rim=new THREE.DirectionalLight(0xffffff,1.25); rim.position.set(-4,5,-7); scene.add(rim);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.ShadowMaterial({color:0x3b3027, opacity:.17})); floor.rotation.x=-Math.PI/2; floor.position.y=-2.15; floor.receiveShadow=true; scene.add(floor);
    const cube = new THREE.Group(); cube.scale.setScalar(.756); cube.rotation.set(-.12,.45,0); scene.add(cube);
    // User-specified Rubik palette. F2L orientation: white cross starts on D (bottom).
    const colors={R:0xb61a1a,L:0xff5900,U:0xd9bd24,D:0xffffff,F:0x21c925,B:0x0045ad};
    const faces=[['R',[1,0,0]],['L',[-1,0,0]],['U',[0,1,0]],['D',[0,-1,0]],['F',[0,0,1]],['B',[0,0,-1]]];
    // Colors reach the outside edges, while inner tile seams stay open with speed-cube corner cutouts.
    const cubies=[]; const bodyGeo=new RoundedBoxGeometry(1.235,1.235,1.235,5,.075); const black=new THREE.MeshPhysicalMaterial({color:0x111213,roughness:.3,metalness:.02});
    const stickerGeo=new RoundedBoxGeometry(1.205,1.205,.075,5,.145);
    const maskedMaterial=new THREE.MeshPhysicalMaterial({color:0x111213,roughness:.3,metalness:.02}); let f2lPractice=false;
    for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
      const piece=new THREE.Group(); piece.position.set(x*1.24,y*1.24,z*1.24); piece.userData={coord:{x,y,z},homeCoord:{x,y,z},containsYellow:y===1};
      const body=new THREE.Mesh(bodyGeo,black); body.castShadow=body.receiveShadow=true; piece.add(body);
      faces.forEach(([name,[nx,ny,nz]])=>{ if((nx&&x===nx)||(ny&&y===ny)||(nz&&z===nz)){ const s=new THREE.Mesh(stickerGeo,new THREE.MeshPhysicalMaterial({color:colors[name],roughness:.28,metalness:.01,clearcoat:.22,clearcoatRoughness:.3})); s.position.set(nx*.655,ny*.655,nz*.655); if(nx) s.rotation.y=Math.PI/2; if(ny) s.rotation.x=Math.PI/2; s.userData={face:name,axis:nx?'x':ny?'y':'z', layer:nx||ny||nz,originalMaterial:s.material}; piece.add(s); }});
      cube.add(piece); cubies.push(piece);
    }
    // Preserve visual home orientation so a corner twisted in its own slot remains selectable.
    cubies.forEach(piece=>piece.userData.homeQuaternion=piece.quaternion.clone());
    const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2(); let busy=false, moves=0, selectedCorner=null, selectedEdge=null, pointerDown=null;
    // Mesh tubes give outlines a dependable 2px-like weight; WebGL ignores LineBasicMaterial linewidth.
    function createThickOutline(color){const outline=new THREE.Group(), half=.66, points=[[-half,-half,-half],[half,-half,-half],[half,half,-half],[-half,half,-half],[-half,-half,half],[half,-half,half],[half,half,half],[-half,half,half]].map(([x,y,z])=>new THREE.Vector3(x,y,z)), edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]], material=new THREE.MeshBasicMaterial({color}); edges.forEach(([from,to])=>{const a=points[from],b=points[to],length=a.distanceTo(b),line=new THREE.Mesh(new THREE.CylinderGeometry(.014,.014,length,6),material); line.position.copy(a).add(b).multiplyScalar(.5); line.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize()); outline.add(line);}); return outline;}
    const selectedOutline=createThickOutline(0xff4b2b); selectedOutline.visible=false; cube.add(selectedOutline);
    const pairedEdgeOutline=createThickOutline(0x0077ff); pairedEdgeOutline.visible=false; cube.add(pairedEdgeOutline);
    // A small layered brush mark, with tapered irregular strokes rather than a geometric line X.
    const pairMarkerMaterial=new THREE.MeshBasicMaterial({color:0x9ca3af,depthTest:true,depthWrite:false,transparent:false});
    const orangeMarkerMaterial=new THREE.MeshBasicMaterial({color:0xe11d48,depthTest:true,depthWrite:false,transparent:false}); const pairMarkers=[];
    function createBrushX(material=pairMarkerMaterial){const mark=new THREE.Group(), strokes=[[-.35,-.31,.32,.35],[-.35,-.28,.34,.31],[-.29,-.35,.36,.29],[-.33,.32,.34,-.34],[-.36,.27,.31,-.35],[-.27,.35,.36,-.28]]; strokes.forEach(([x1,y1,x2,y2],index)=>{const wobble=(index%3-1)*.025; const path=new THREE.CatmullRomCurve3([new THREE.Vector3(x1,y1,.006),new THREE.Vector3(wobble,wobble,.011),new THREE.Vector3(x2,y2,.006)]); const geometry=new THREE.TubeGeometry(path,12,.007+(index%2)*.002,5,false); mark.add(new THREE.Mesh(geometry,material));}); return mark;}
    const round=n=>Math.round(n); function updateMoves(){moveEl.textContent=String(moves).padStart(2,'0');}
    function rotateLayer(axis,layer,dir=1){ if(busy)return; busy=true; controls.autoRotate=false; stateEl.textContent='ROTATING'; const pivot=new THREE.Group(); cube.add(pivot); const chosen=cubies.filter(p=>p.userData.coord[axis]===layer); chosen.forEach(p=>pivot.attach(p)); const start=performance.now(), angle=dir*Math.PI/2, duration=240;
      function tick(now){const t=Math.min((now-start)/duration,1), ease=1-Math.pow(1-t,4); pivot.rotation[axis]=angle*ease; if(t<1)requestAnimationFrame(tick); else { pivot.updateMatrixWorld(); chosen.forEach(p=>{cube.attach(p); const c=p.userData.coord; const a=axis==='x'?'y':axis==='y'?'z':'x'; const b=axis==='x'?'z':axis==='y'?'x':'y'; const oldA=c[a],oldB=c[b]; c[a]=round(dir===1?-oldB:oldB); c[b]=round(dir===1?oldA:-oldA); p.position.set(c.x*1.24,c.y*1.24,c.z*1.24); p.rotation.set(Math.round(p.rotation.x/(Math.PI/2))*Math.PI/2,Math.round(p.rotation.y/(Math.PI/2))*Math.PI/2,Math.round(p.rotation.z/(Math.PI/2))*Math.PI/2); }); cube.remove(pivot); busy=false; moves++; updateMoves(); stateEl.textContent='READY'; }} requestAnimationFrame(tick); }
    function isUnsolvedF2LCorner(piece){const c=piece.userData.coord, h=piece.userData.homeCoord; const isF2LCorner=h.y===-1&&Math.abs(h.x)===1&&Math.abs(h.z)===1; const displaced=c.x!==h.x||c.y!==h.y||c.z!==h.z; const twisted=piece.quaternion.angleTo(piece.userData.homeQuaternion)>1e-4; return isF2LCorner&&(displaced||twisted);}
    // The matching F2L edge shares the corner's two non-white home-face directions.
    function getPairedF2LEdge(corner){const h=corner.userData.homeCoord; return cubies.find(piece=>{const edge=piece.userData.homeCoord; return edge.y===0&&edge.x===h.x&&edge.z===h.z;});}
    // Mark every side-color sticker belonging to this pair—both colors on its corner and edge.
    function showPairMarkers(corner,edge){pairMarkers.forEach(marker=>marker.removeFromParent()); pairMarkers.length=0; if(!corner||!edge)return; [corner,edge].forEach(piece=>piece.children.filter(mesh=>mesh.userData.originalMaterial&&mesh.userData.face!=='D'&&mesh.userData.face!=='U').forEach(sticker=>{const isOrange=sticker.userData.face==='L', isBlue=sticker.userData.face==='B', marker=createBrushX(isOrange?orangeMarkerMaterial:pairMarkerMaterial); marker.position.z=isOrange||isBlue?-.1:.082; marker.renderOrder=100; sticker.add(marker); pairMarkers.push(marker);}));}
    function clearF2LSelection(){selectedCorner=null; selectedEdge=null; selectedOutline.visible=false; pairedEdgeOutline.visible=false; pairMarkers.forEach(marker=>marker.removeFromParent()); pairMarkers.length=0;}
    function selectCorner(event){const rect=renderer.domElement.getBoundingClientRect(); pointer.set(((event.clientX-rect.left)/rect.width)*2-1,-((event.clientY-rect.top)/rect.height)*2+1); raycaster.setFromCamera(pointer,camera); const hit=raycaster.intersectObjects(cubies,true)[0]; const piece=hit&&cubies.find(candidate=>candidate.children.includes(hit.object)); if(!piece||!isUnsolvedF2LCorner(piece)) return; clearF2LSelection(); selectedCorner=piece; selectedEdge=getPairedF2LEdge(piece); selectedOutline.position.copy(piece.position); selectedOutline.quaternion.copy(piece.quaternion); selectedOutline.visible=true; if(selectedEdge){pairedEdgeOutline.position.copy(selectedEdge.position); pairedEdgeOutline.quaternion.copy(selectedEdge.quaternion); pairedEdgeOutline.visible=true;} showPairMarkers(selectedCorner,selectedEdge); stateEl.textContent='F2L CORNER + EDGE SELECTED';}
    renderer.domElement.addEventListener('pointerdown',event=>pointerDown={x:event.clientX,y:event.clientY}); renderer.domElement.addEventListener('pointerup',event=>{if(pointerDown&&Math.hypot(event.clientX-pointerDown.x,event.clientY-pointerDown.y)<6)selectCorner(event); pointerDown=null;});
    document.addEventListener('keydown',e=>{const map={r:['x',1],l:['x',-1],u:['y',1],d:['y',-1],f:['z',1],b:['z',-1]}; const key=map[e.key.toLowerCase()]; if(key){clearF2LSelection(); rotateLayer(...key,e.shiftKey?-1:1);}});
    const practiceButton=document.querySelector('#f2l-practice'), scrambleButton=document.querySelector('#f2l-scramble');
    const waitForIdle=()=>new Promise(resolve=>{const check=()=>busy?setTimeout(check,20):resolve(); check();});
    async function runMoves(moves,delay=55){for(const move of moves){rotateLayer(...moveMap[move]); await waitForIdle(); if(delay) await new Promise(resolve=>setTimeout(resolve,delay));}}
    const moveMap={R:['x',1,1],'R′':['x',1,-1],L:['x',-1,-1],'L′':['x',-1,1],U:['y',1,1],'U′':['y',1,-1],F:['z',1,1],'F′':['z',1,-1]};
    const f2lScrambles=[['U','R','U′','R′'],['U′','L','U','L′'],['U','F','U′','F′'],['U′','F′','U','F']];
    practiceButton.onclick=()=>{f2lPractice=!f2lPractice; cubies.forEach(piece=>{if(piece.userData.containsYellow) piece.children.forEach(mesh=>{if(mesh.userData.originalMaterial) mesh.material=f2lPractice?maskedMaterial:mesh.userData.originalMaterial;});}); practiceButton.classList.toggle('is-active',f2lPractice); practiceButton.setAttribute('aria-pressed',String(f2lPractice)); practiceButton.textContent=f2lPractice?'THOÁT F2L':'LUYỆN F2L'; stateEl.textContent=f2lPractice?'F2L / CROSS ONLY':'WHITE CROSS ↓';};
    scrambleButton.onclick=async()=>{if(busy)return; clearF2LSelection(); await runMoves(f2lScrambles[Math.floor(Math.random()*f2lScrambles.length)]); stateEl.textContent='F2L SCRAMBLED · SELECT A CORNER';};
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    renderer.setAnimationLoop(()=>{controls.update(); renderer.render(scene,camera);});
  </script>
</body>
</html>
