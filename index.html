    function renderFormulaButtons(){
      formulaPanel.innerHTML='';
      formulaPanel.classList.remove('is-sheet-dragging','is-sheet-dismissing');
      formulaPanel.style.transform=''; formulaPanel.style.opacity='';
      if(openCaseId&&isMobileUi()){
        const drag=document.createElement('button');
        drag.type='button'; drag.className='case-drag'; drag.setAttribute('aria-label','Kéo xuống để đóng');
        drag.title='Kéo xuống để đóng';
        formulaPanel.appendChild(drag);
      }
      f2lSetups.forEach(entry=>{
        const card=document.createElement('div');
        card.className=`case-card${openCaseId===entry.id?' is-open':''}`;
        const main=document.createElement('button');
        main.type='button'; main.className='case-main'; main.title='Mở setup & công thức giải';
        if(entry.preview){const img=document.createElement('img'); img.className='preview'; img.src=entry.preview; img.alt=`Preview ${entry.id}`; img.loading='lazy'; main.appendChild(img);}
        const label=document.createElement('span'); label.className='formula-id'; label.textContent=entry.id; main.appendChild(label);
        main.onclick=()=>{openCaseId=openCaseId===entry.id?null:entry.id; if(openCaseId) openSlot=f2lSlotOrder.find(s=>entry.slots?.[s])||'FR'; renderFormulaButtons();};
        card.appendChild(main);
        const options=document.createElement('div'); options.className='case-options';
        const tabs=document.createElement('div'); tabs.className='slot-tabs'; tabs.setAttribute('role','tablist');
        f2lSlotOrder.forEach(slot=>{
          const tab=document.createElement('button'); tab.type='button'; tab.textContent=slot; tab.className=openSlot===slot?'is-active':'';
          tab.setAttribute('aria-selected',String(openSlot===slot));
          tab.onclick=()=>selectF2LSlot(slot);
          tabs.appendChild(tab);
        });
        options.appendChild(tabs);
        const slotData=entry.slots?.[openSlot]||{setup:'',solutions:[]};
        const list=document.createElement('div'); list.className='opt-list';
        list.appendChild(createAlgRow({
          id:`${entry.id}|${openSlot}|setup`,
          label:`SETUP · ${slotData.setup||'—'}`,
          sequence:slotData.setup||'',
          isSetup:true,
          status:`SETUP · ${entry.id} · ${openSlot}`,
          extraClass:'opt-setup'
        }));
        (slotData.solutions||[]).forEach((alg,index)=>{
          list.appendChild(createAlgRow({
            id:`${entry.id}|${openSlot}|solve|${index}`,
            label:`GIẢI ${index+1} · ${alg}`,
            sequence:alg,
            isSetup:false,
            status:`SOLVE · ${entry.id} · ${openSlot} · ${index+1}`
          }));
        });
        options.appendChild(list);
        card.appendChild(options);
        formulaPanel.appendChild(card);
        enableCaseSwipeDismiss(card);
      });
    }
    renderFormulaButtons();
    // Every macro restores the D-layer cross; a fresh randomized chain prevents repeating the same easy setup.
    const f2lMacros=[['R','U','R′'],['R','U′','R′'],['L','U','L′'],['L','U′','L′'],['F','U','F′'],['F','U′','F′'],['B','U','B′'],['B','U′','B′']];
    function randomF2LScramble(){const count=5+Math.floor(Math.random()*5), result=[]; let previous=-1; while(result.length<count*3){let index=Math.floor(Math.random()*f2lMacros.length); if(index===previous)continue; result.push(...f2lMacros[index]); previous=index;} return result;}
    function setF2LPractice(enabled){f2lPractice=enabled; cubies.forEach(piece=>{if(piece.userData.containsYellow) piece.children.forEach(mesh=>{if(mesh.userData.originalMaterial) mesh.material=f2lPractice?maskedMaterial:mesh.userData.originalMaterial;});}); practiceButton.classList.toggle('is-active',f2lPractice); practiceButton.setAttribute('aria-pressed',String(f2lPractice)); practiceButton.textContent=f2lPractice?'THOÁT F2L':'LUYỆN F2L'; stateEl.textContent=f2lPractice?'F2L / CROSS ONLY':'WHITE CROSS ↓'; persistSetting('rubik-f2l-practice',f2lPractice?'1':'0');}
    practiceButton.onclick=()=>setF2LPractice(!f2lPractice);
    if(readSetting('rubik-f2l-practice')==='1')setF2LPractice(true);
    scrambleButton.onclick=async()=>{if(busy)return; clearF2LSelection(); await runMoves(randomF2LScramble()); stateEl.textContent='F2L RANDOMIZED · SELECT A CORNER';};
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    renderer.setAnimationLoop(()=>{controls.update(); renderer.render(scene,camera);});
  </script>
</body>
</html>
