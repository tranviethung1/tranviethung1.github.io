  <style>
    :root{--cream:#f4f0e8;--ink:#121212;--accent:#ff4b2b;--line:rgba(18,18,18,.16)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font:500 16px 'Space Grotesk',sans-serif}.brand{font:800 clamp(28px,5vw,52px)/.8 Syne;letter-spacing:-.08em}.brand span,.eyebrow{color:var(--accent)}.site-menu-toggle{position:fixed;z-index:4;left:20px;top:18px;width:44px;height:44px;border:0;border-radius:12px;background:#fff;font-size:0;cursor:pointer}.site-menu-toggle:before{content:'';display:block;width:19px;height:13px;margin:auto;border-top:2px solid;border-bottom:2px solid;background:linear-gradient(currentColor,currentColor) center/100% 2px no-repeat}.site-menu-toggle[aria-expanded=true]:before{width:18px;height:18px;border:0;background:linear-gradient(45deg,transparent 45%,currentColor 46% 54%,transparent 55%),linear-gradient(-45deg,transparent 45%,currentColor 46% 54%,transparent 55%)}header{padding:28px 32px 28px 86px}.site-nav-backdrop{position:fixed;inset:0;z-index:3;border:0;background:rgba(18,18,18,.28);opacity:0;pointer-events:none}.site-nav-backdrop.open{opacity:1;pointer-events:auto}.site-nav{position:fixed;z-index:4;inset:0 auto 0 0;width:min(310px,84vw);padding:22px 0;background:var(--cream);box-shadow:12px 0 32px rgba(0,0,0,.2);transform:translateX(-105%);transition:transform .24s;overflow:auto}.site-nav.open{transform:none}.site-nav-head{display:flex;justify-content:space-between;align-items:center;padding:0 18px 18px;border-bottom:1px solid var(--line)}.site-nav-close{border:0;background:transparent;font-size:25px;cursor:pointer}.site-nav ul{margin:10px 0;padding:0;list-style:none}.site-nav a,.site-nav button{display:flex;width:100%;min-height:48px;padding:0 18px;align-items:center;border:0;background:transparent;color:inherit;text-decoration:none;font:700 13px Syne;cursor:pointer}.site-nav a:hover,.site-nav button:hover{background:var(--ink);color:var(--cream)}.site-nav-sub{display:none;background:rgba(18,18,18,.04)   <script>if(new URLSearchParams(location.search).has('test'))location.replace('./f2l/?test=1');const t=document.querySelector('#menu-toggle'),n=document.querySelector('#site-nav'),b=document.querySelector('#nav-backdrop'),c=document.querySelector('#nav-close'),s=document.querySelector('#statistics-toggle'),sub=document.querySelector('#statistics-sub');function open(v){n.classList.toggle('open',v);b.classList.toggle('open',v);t.setAttribute('aria-expanded',v)}t.onclick=()=>open(!n.classList.contains('open'));b.onclick=c.onclick=()=>open(false);s.onclick=()=>{const v=s.getAttribute('aria-expanded')!=='true';s.setAttribute('aria-expanded',v);sub.classList.toggle('open',v)};addEventListener('keydown',e=>{if(e.key==='Escape')open(false)})</script>
