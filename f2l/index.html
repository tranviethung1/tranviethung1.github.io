              // that leaves an immediately usable/short F2L candidate. This only
              // guides equivalent branches; the final plan remains minimum-move.

        }finally{scrambleMoveDuration=priorDuration; scrambleDelay=priorDelay; clearF2LSelection();}
      }
    });
    let openAdvancedMethodId=null, openAdvancedSlot='FR', activeAdvancedMethodId=null;
    const viewedAdvancedMethods=new Set((readSetting('rubik-af2l-viewed')||'').split('|').map(decodeURIComponent).filter(Boolean));
    function markAdvancedMethodViewed(methodId){
      if(!methodId||viewedAdvancedMethods.has(methodId)) return;
      viewedAdvancedMethods.add(methodId);
      persistSetting('rubik-af2l-viewed', [...viewedAdvancedMethods].map(encodeURIComponent).join('|'));
    }
    function scrollActiveAdvancedIntoView(){
      if(!activeAdvancedMethodId||openAdvancedMethodId) return;
      const container=document.querySelector('#advanced-methods');
      const card=container?.querySelector(`.advanced-method[data-method-id="${CSS.escape(activeAdvancedMethodId)}"]`);
      if(!container||!card) return;
      requestAnimationFrame(()=>{
        const left=card.offsetLeft-(container.clientWidth-card.offsetWidth)/2;
        container.scrollTo({left:Math.max(0,left), behavior:'smooth'});
      });
    }
    function closeOpenAdvancedMethod(){
      if(openAdvancedMethodId) activeAdvancedMethodId=openAdvancedMethodId;
      openAdvancedMethodId=null; algPlayback=null; algPlayToken++; activeAlgId=null;
      renderAdvancedMethods();
      scrollActiveAdvancedIntoView();
    }
    function closeAdvancedDockPanel(){
      const sheet=dockSheetBasic;
      sheet.style.transform=''; sheet.style.opacity='';
      if(openAdvancedMethodId) activeAdvancedMethodId=openAdvancedMethodId;
      openAdvancedMethodId=null; algPlayback=null; algPlayToken++; activeAlgId=null;
      renderAdvancedMethods();
      setContextualSurface(null);
      setDockPanels(null);
      syncMobileDockFromSheets();
    }
    function renderAdvancedMethods(){
      const container=document.querySelector('#advanced-methods');
      if(!container) return;
      container.innerHTML='';
      advancedMethods.forEach(method=>{
        const isOpen=openAdvancedMethodId===method.id;
        const isViewed=viewedAdvancedMethods.has(method.id);
        const isActive=activeAdvancedMethodId===method.id&&!isOpen;
        const card=document.createElement('article');
        card.className=`advanced-method${isOpen?' is-open':''}${isViewed?' is-viewed':''}${isActive?' is-active':''}`;
        card.dataset.methodId=method.id;
        if(isActive) card.setAttribute('aria-current','true');
        const main=document.createElement('button'); main.type='button'; main.className='advanced-method-main'; main.title='Mở setup và công thức giải';
        const image=document.createElement('img'); image.src=`../previews/af2l-${method.id.replace('AF2L -','')}.png`; image.alt=`Preview ${method.name}`;
        const title=document.createElement('b'); title.textContent=method.name;
        main.append(image,title);
        main.onclick=()=>{
          const opening=!isOpen;
          activeAdvancedMethodId=method.id;
          markAdvancedMethodViewed(method.id);
          openAdvancedMethodId=opening?method.id:null;
          if(opening) openAdvancedSlot='FR';
          algPlayback=null; algPlayToken++; activeAlgId=null;
          renderAdvancedMethods();
          if(!opening) scrollActiveAdvancedIntoView();
        };
        const options=document.createElement('div'); options.className='advanced-method-options';
        const tabs=document.createElement('div'); tabs.className='slot-tabs';
        f2lSlotOrder.forEach(slot=>{
          const tab=document.createElement('button'); tab.type='button'; tab.textContent=slot; tab.className=slot===openAdvancedSlot?'is-active':'';
          tab.onclick=()=>{openAdvancedSlot=slot; algPlayback=null; algPlayToken++; activeAlgId=null; renderAdvancedMethods();}; tabs.appendChild(tab);
        });
        const list=document.createElement('div'); list.className='opt-list';
        const {setup,solutions}=method.slots[openAdvancedSlot];
        list.appendChild(createAlgRow({id:`${method.id}:${openAdvancedSlot}:setup`,label:`SETUP · ${setup}`,sequence:setup,isSetup:true,status:`${method.id} · ${openAdvancedSlot} · SETUP`,extraClass:'opt-setup'}));
        solutions.forEach((solution,index)=>list.appendChild(createAlgRow({id:`${method.id}:${openAdvancedSlot}:solve:${index}`,label:`GIẢI ${index+1} · ${solution}`,sequence:solution,isSetup:false,status:`${method.id} · ${openAdvancedSlot} · GIẢI ${index+1}`})));
        options.append(tabs,list); card.append(main,options); container.appendChild(card);
      });
    }
    renderAdvancedMethods();
    const isMobileUi=()=>matchMedia('(max-width:720px)').matches;
    function scrollActiveCaseIntoView(){
      if(!activeCaseId||openCaseId) return;
      const card=formulaPanel.querySelector(`.case-card[data-case-id="${CSS.escape(activeCaseId)}"]`);
      const strip=formulaPanel.querySelector('.case-strip');
      if(!card) return;
      requestAnimationFrame(()=>{
        if(strip){
          const left=card.offsetLeft-(strip.clientWidth-card.offsetWidth)/2;
          strip.scrollTo({left:Math.max(0,left), behavior:'smooth'});
        } else {
          card.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
        }
      });
    }
    function closeOpenCase(){
      if(openCaseId) activeCaseId=openCaseId;
      openCaseId=null; algPlayback=null; algPlayToken++; activeAlgId=null;
      renderFormulaButtons();
      scrollActiveCaseIntoView();
    }
    function closeCasesDockPanel(){
      formulaPanel.classList.remove('is-sheet-dragging','is-sheet-dismissing');
      formulaPanel.style.transform=''; formulaPanel.style.opacity='';
      if(openCaseId) activeCaseId=openCaseId;
      openCaseId=null; algPlayback=null; algPlayToken++; activeAlgId=null;
      setContextualSurface(null);
      setDockPanels(null);
      syncMobileDockFromSheets();
      renderFormulaButtons();
    }
    function enableFormulaPanelSwipeDismiss(){
      if(!isMobileUi()) return;
      const handle=formulaPanel.querySelector(':scope > .case-drag');
      if(!handle) return;
      let startY=0, startX=0, dragging=false, dy=0, moved=false;
      const applyShift=(y, opacity)=>{
        formulaPanel.style.transform=`translateY(${y}px)`;
        formulaPanel.style.opacity=opacity;
      };
      const clearShift=()=>{
        formulaPanel.style.transform='';
        formulaPanel.style.opacity='';
      };
      const onStart=(event)=>{
        const point=event.touches?event.touches[0]:event;
        startY=point.clientY; startX=point.clientX; dragging=true; dy=0; moved=false;
        formulaPanel.classList.add('is-sheet-dragging');
      };
      const onMove=(event)=>{
        if(!dragging) return;
        const point=event.touches?event.touches[0]:event;
        const deltaY=point.clientY-startY, deltaX=point.clientX-startX;
        if(Math.abs(deltaX)>Math.abs(deltaY)&&dy<8) return;
        dy=Math.max(0, deltaY);
        if(dy>6) moved=true;
        applyShift(dy, String(Math.max(.35, 1-dy/220)));
        if(event.cancelable) event.preventDefault();
      };
      const onEnd=()=>{
        if(!dragging) return;
        dragging=false; formulaPanel.classList.remove('is-sheet-dragging');
        if(dy>72){
          formulaPanel.classList.add('is-sheet-dismissing');
          applyShift(Math.max(dy,180), '0');
          setTimeout(()=>{
            if(openCaseId) closeOpenCase();
            else closeCasesDockPanel();
          }, 180);
        } else {
          clearShift();
        }
        dy=0;
      };
      handle.addEventListener('touchstart', onStart, {passive:true});
      handle.addEventListener('touchmove', onMove, {passive:false});
      handle.addEventListener('touchend', onEnd);
      handle.addEventListener('touchcancel', onEnd);
      handle.addEventListener('click', event=>{
        if(moved){ event.preventDefault(); moved=false; return; }
        if(openCaseId) closeOpenCase();
        else closeCasesDockPanel();
      });
    }
    function enableAdvancedSheetSwipeDismiss(){
      const sheet=dockSheetBasic, handle=document.querySelector('#advanced-sheet-drag');
      if(!handle||handle.dataset.bound==='1') return;
      handle.dataset.bound='1';
      let startY=0, dragging=false, dy=0, moved=false;
      const clear=()=>{sheet.style.transform=''; sheet.style.opacity='';};
      const start=event=>{const point=event.touches?event.touches[0]:event; startY=point.clientY; dragging=true; dy=0; moved=false;};
      const move=event=>{
        if(!dragging) return;
        const point=event.touches?event.touches[0]:event; dy=Math.max(0,point.clientY-startY);
        if(dy>6) moved=true;
        sheet.style.transform=`translateY(${dy}px)`; sheet.style.opacity=String(Math.max(.35,1-dy/220));
        if(event.cancelable) event.preventDefault();
      };
      const end=()=>{
        if(!dragging) return;
        dragging=false;
        if(dy>72){
          sheet.style.transform=`translateY(${Math.max(dy,180)}px)`; sheet.style.opacity='0';
          setTimeout(()=>{
            clear();
            if(openAdvancedMethodId) closeOpenAdvancedMethod();
            else closeAdvancedDockPanel();
          },180);
        } else clear();
        dy=0;
      };
      handle.addEventListener('touchstart',start,{passive:true});
      handle.addEventListener('touchmove',move,{passive:false});
      handle.addEventListener('touchend',end); handle.addEventListener('touchcancel',end);
      handle.addEventListener('click',event=>{
        if(moved){event.preventDefault(); moved=false; return;}
        if(openAdvancedMethodId) closeOpenAdvancedMethod();
        else closeAdvancedDockPanel();
      });
    }
    enableAdvancedSheetSwipeDismiss();
    function enableKeyholeSheetSwipeDismiss(){
      const sheet=dockSheetKeyhole, handle=keyholeSheetDrag;
      if(!handle||handle.dataset.bound==='1') return;
      handle.dataset.bound='1';
      let startY=0, dragging=false, dy=0, moved=false;
      const clear=()=>{sheet.style.transform=''; sheet.style.opacity='';};
      const start=event=>{const point=event.touches?event.touches[0]:event; startY=point.clientY; dragging=true; dy=0; moved=false;};
      const move=event=>{if(!dragging)return; const point=event.touches?event.touches[0]:event; dy=Math.max(0,point.clientY-startY); if(dy>6)moved=true; sheet.style.transform=`translateY(${dy}px)`; sheet.style.opacity=String(Math.max(.35,1-dy/220)); if(event.cancelable)event.preventDefault();};
      const end=()=>{if(!dragging)return; dragging=false; if(dy>72){sheet.style.transform='translateY(100%)'; sheet.style.opacity='0'; setTimeout(()=>{clear();setDockPanels(null);syncMobileDockFromSheets();},180);}else clear(); dy=0;};
      handle.addEventListener('touchstart',start,{passive:true}); handle.addEventListener('touchmove',move,{passive:false}); handle.addEventListener('touchend',end); handle.addEventListener('touchcancel',end);
      handle.addEventListener('click',event=>{if(moved){event.preventDefault();moved=false;return;} setDockPanels(null);syncMobileDockFromSheets();});
    }
    enableKeyholeSheetSwipeDismiss();
    // Changing an F2L slot is UI-only: retain the exact viewing direction and Rubik state.
    function selectF2LSlot(slot){
      const cameraPosition=camera.position.clone(), cameraQuaternion=camera.quaternion.clone();
      const cameraTarget=controls.target.clone(), cubeRotation=cube.rotation.clone();
      openSlot=slot;
      algPlayback=null;
      algPlayToken++;
      activeAlgId=null;
      renderFormulaButtons();
      camera.position.copy(cameraPosition);
      camera.quaternion.copy(cameraQuaternion);
      controls.target.copy(cameraTarget);
      cube.rotation.copy(cubeRotation);
      controls.update();
    }
    function renderFormulaButtons(){
      formulaPanel.innerHTML='';
      formulaPanel.classList.remove('is-sheet-dragging','is-sheet-dismissing');
      formulaPanel.style.transform=''; formulaPanel.style.opacity='';
      if(isMobileUi()){
        const drag=document.createElement('button');
        drag.type='button'; drag.className='case-drag'; drag.setAttribute('aria-label','Kéo xuống để đóng');
        drag.title='Kéo xuống để đóng';
        formulaPanel.appendChild(drag);
      }
      const caseListParent=(!openCaseId&&isMobileUi())?(()=>{
        const strip=document.createElement('div');
        strip.className='case-strip';
        formulaPanel.appendChild(strip);
        return strip;
      })():formulaPanel;
      f2lSetups.forEach(entry=>{
        const card=document.createElement('div');
        const viewed=viewedF2LCases.has(entry.id);
        const isActive=activeCaseId===entry.id&&openCaseId!==entry.id;
        card.className=`case-card${openCaseId===entry.id?' is-open':''}${viewed?' is-viewed':''}${isActive?' is-active':''}`;
        card.dataset.caseId=entry.id;
        if(viewed) card.setAttribute('data-viewed','true');
        if(isActive) card.setAttribute('aria-current','true');
        const main=document.createElement('button');
        main.type='button'; main.className='case-main'; main.title='Mở setup & công thức giải';
        if(entry.preview){const img=document.createElement('img'); img.className='preview'; img.src=entry.preview; img.alt=`Preview ${entry.id}`; img.loading='lazy'; main.appendChild(img);}
        const label=document.createElement('span'); label.className='formula-id'; label.textContent=entry.id; main.appendChild(label);
        main.onclick=()=>{
          const opening=openCaseId!==entry.id;
          openCaseId=opening?entry.id:null;
          activeCaseId=entry.id;
          if(opening){
            openSlot=f2lSlotOrder.find(s=>entry.slots?.[s])||'FR';
            markF2LCaseViewed(entry.id);
          }
          renderFormulaButtons();
          if(!opening) scrollActiveCaseIntoView();
        };
        card.appendChild(main);
        const options=document.createElement('div'); options.className='case-options';
        const tabs=document.createElement('div'); tabs.className='slot-tabs'; tabs.setAttribute('role','tablist');
        f2lSlotOrder.forEach(slot=>{
          const tab=document.createElement('button'); tab.type='button'; tab.textContent=slot; tab.className=openSlot===slot?'is-active':'';
          tab.setAttribute('aria-selected',String(openSlot===slot));
          tab.onclick=()=>selectF2LSlot(slot);
          tabs.appendChild(tab);
        });
        options.appendChild(tabs);
        const slotData=entry.slots?.[openSlot]||{setup:'',solutions:[]};
        const list=document.createElement('div'); list.className='opt-list';
        list.appendChild(createAlgRow({
          id:`${entry.id}|${openSlot}|setup`,
          label:`SETUP · ${slotData.setup||'—'}`,
          sequence:slotData.setup||'',
          isSetup:true,
          status:`SETUP · ${entry.id} · ${openSlot}`,
          extraClass:'opt-setup'
        }));
        (slotData.solutions||[]).forEach((alg,index)=>{
          list.appendChild(createAlgRow({
            id:`${entry.id}|${openSlot}|solve|${index}`,
            label:`GIẢI ${index+1} · ${alg}`,
            sequence:alg,
            isSetup:false,
            status:`SOLVE · ${entry.id} · ${openSlot} · ${index+1}`
          }));
        });
        options.appendChild(list);
        card.appendChild(options);
        caseListParent.appendChild(card);
      });
      enableFormulaPanelSwipeDismiss();
    }
    renderFormulaButtons();
    function playUiEntrance(){
      if(!window.anime||matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      anime({targets:'.brand', opacity:[0,1], translateY:[-16,0], duration:700, easing:'easeOutExpo'});
      anime({targets:'.practice-controls button, .settings-toggle, .reset-cube, .move-pad-toggle, .status', opacity:[0,1], translateY:[-10,0], delay:anime.stagger(50,{start:120}), duration:520, easing:'easeOutCubic'});
      anime({targets:'.formula-panel .case-card', opacity:[0,1], translateX:[24,0], delay:anime.stagger(45,{start:180}), duration:520, easing:'easeOutCubic'});
    }
    if(document.readyState==='complete') playUiEntrance();
    else addEventListener('load', playUiEntrance, {once:true});
    // Every macro restores the D-layer cross; a fresh randomized chain prevents repeating the same easy setup.
    const f2lMacros=[['R','U','R′'],['R','U′','R′'],['L','U','L′'],['L','U′','L′'],['F','U','F′'],['F','U′','F′'],['B','U','B′'],['B','U′','B′']];
    function randomF2LScramble(){const count=5+Math.floor(Math.random()*5), result=[]; let previous=-1; while(result.length<count*3){let index=Math.floor(Math.random()*f2lMacros.length); if(index===previous)continue; result.push(...f2lMacros[index]); previous=index;} return result;}
    function setF2LPractice(enabled){f2lPractice=enabled; cubies.forEach(piece=>{if(piece.userData.containsYellow) piece.children.forEach(mesh=>{if(mesh.userData.originalMaterial) mesh.material=f2lPractice?maskedMaterial:mesh.userData.originalMaterial;});}); practiceButton.classList.toggle('is-active',f2lPractice); practiceButton.setAttribute('aria-pressed',String(f2lPractice)); practiceButton.textContent=f2lPractice?'THOÁT TẬP TRUNG':'TẬP TRUNG F2L'; stateEl.textContent=f2lPractice?'F2L / CROSS ONLY':'WHITE CROSS ↓'; persistSetting('rubik-f2l-practice',f2lPractice?'1':'0');}
    practiceButton.onclick=()=>setF2LPractice(!f2lPractice);
    if(readSetting('rubik-f2l-practice')==='1')setF2LPractice(true);
    scrambleButton.onclick=async()=>{if(busy)return; knownF2LCase=null; clearF2LSelection(); await runMoves(randomF2LScramble()); stateEl.textContent='F2L RANDOMIZED · SELECT A CORNER';};
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    renderer.setAnimationLoop(()=>{controls.update(); renderer.render(scene,camera);});
  </script>
</body>
